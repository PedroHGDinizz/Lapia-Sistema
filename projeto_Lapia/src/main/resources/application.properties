spring.application.name=projeto_Lapia

# Configuracoes do Banco de Dados PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lapia_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sua_senha_local}

# Driver e Dialeto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Estrategia de DDL
spring.jpa.hibernate.ddl-auto=update

# Logs do SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true