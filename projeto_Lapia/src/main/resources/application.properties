spring.application.name=projeto_Lapia

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lapia_db
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD

# Driver e Dialeto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Estratégia de DDL (Importante para o desenvolvimento)
# 'update' cria ou atualiza as tabelas automaticamente sem apagar seus dados
spring.jpa.hibernate.ddl-auto=update

# Logs do SQL (Muito útil para ver se as escalas estão sendo salvas corretamente)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Console do H2 (Opcional, se quiser testar algo rápido em memória)
# spring.h2.console.enabled=false
